name: YEON V5 / Research Atlas browser QA
on:
  pull_request:
    paths:
      - "app-v5/**"
      - "tests/v5-browser-smoke.mjs"
      - ".github/workflows/v5-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test the V5 research journeys
        run: node tests/v5-browser-smoke.mjs
      - name: Save viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yeon-v5-responsive-captures
          path: artifacts/v5
          if-no-files-found: ignore
