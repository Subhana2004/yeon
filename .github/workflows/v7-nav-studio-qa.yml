name: YEON V7 / Four Navigation Studio Variations
on:
  pull_request:
    paths:
      - "app-v7-fieldwork/**"
      - "tests/v7-nav-studio.mjs"
      - ".github/workflows/v7-nav-studio-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  four-variations:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run all four navigation workflows
        run: node tests/v7-nav-studio.mjs
      - name: Save screenshots of each selected navigation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yeon-four-navigation-variations
          path: artifacts/nav-studio/
          if-no-files-found: ignore
