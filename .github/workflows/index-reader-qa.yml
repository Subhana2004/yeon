name: Index reader checks
on:
  pull_request:
    paths:
      - 'app-index/**'
      - 'tests/index-reader.mjs'
      - '.github/workflows/index-reader-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1 axe-core@4.14.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/index-reader.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: index-reader-qa
          path: artifacts/index-reader
