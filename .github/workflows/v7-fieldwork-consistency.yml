name: YEON Fieldwork / Site-wide Visual Consistency
on:
  pull_request:
    paths:
      - "app-v7-fieldwork/**"
      - "tests/v7-fieldwork-consistency.mjs"
      - ".github/workflows/v7-fieldwork-consistency.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate site-wide design invariants in Chromium
        run: node tests/v7-fieldwork-consistency.mjs
      - name: Save screenshots of every tool desktop and mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yeon-fieldwork-consistency-screenshots
          path: artifacts/fieldwork-consistency/
          if-no-files-found: ignore
