name: YEON Fieldwork / Skill-first Chromium QA
on:
  pull_request:
    paths:
      - "app-v7-fieldwork/**"
      - "tests/v7-fieldwork-chromium.mjs"
      - ".github/workflows/v7-fieldwork-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run real interactive browser QA
        run: node tests/v7-fieldwork-chromium.mjs
      - name: Preserve screenshots for visual critique
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yeon-fieldwork-desktop-mobile-screens
          path: artifacts/fieldwork
          if-no-files-found: ignore
