name: YEON V6 / Editorial Research Reader QA
on:
  pull_request:
    paths:
      - "app-v6/**"
      - "tests/v6-browser-smoke.mjs"
      - ".github/workflows/v6-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium / Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test V6 interactive research journeys
        run: node tests/v6-browser-smoke.mjs
      - name: Retain actual viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yeon-v6-browser-screenshots
          path: artifacts/v6
          if-no-files-found: ignore
