<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f4f6fa" />
    <meta
      name="description"
      content="Explore research questions, laboratory dossiers, methods and their evidence in YEON’s research index."
    />
    <title>Explore · YEON Research Index</title>
    <link
      rel="preload"
      href="./assets/serif.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./assets/serif-italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./assets/sans.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="modulepreload" href="./views/discovery.js" />
    <link rel="modulepreload" href="./data/catalog.js" />
    <link rel="icon" href="./assets/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="mast">
      <div class="mast-inner">
        <a class="brand" href="#explore" aria-label="YEON home"
          ><img src="./assets/mark.svg" alt="" width="34" height="34" /><b
            >YEON</b
          ></a
        ><span class="edition">Research Index</span>
        <nav id="topnav" aria-label="Primary"></nav>
        <button
          class="menu"
          id="menu"
          aria-expanded="false"
          aria-controls="topnav"
        >
          Menu
        </button>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <p class="loading" role="status">Opening the research index…</p>
      <noscript
        >Enable JavaScript to search the collection and open research
        tools.</noscript
      >
    </main>
    <footer>
      <span
        ><strong>YEON</strong> &nbsp; Independent Korean research
        exploration</span
      ><a href="#sources">Sources &amp; provenance</a>
    </footer>
    <div id="notice" role="status" aria-live="polite"></div>
  </body>
</html>
